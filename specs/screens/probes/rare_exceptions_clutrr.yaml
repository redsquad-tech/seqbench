id: screen.noise.rare_exceptions
property: noise_robustness
version: 1
protocol: training_contrast
requires: [learn, generate]
train:
  select: {dataset: clutrr, config: gen_train23_test2to10, split: train, variant: full}
control:
  select: {dataset: clutrr, config: gen_train23_test2to10, split: test, variant: full}
stress:
  select: {dataset: clutrr, config: gen_train23_test2to10, split: test, variant: rare_exception_test}
pair_by: probe_group_id
metrics:
  primary: normalized_exact_match
  optional: [candidate_accuracy, nll_bits]
difficulty_axes: [reasoning_depth]
options:
  stress_train: {dataset: clutrr, config: gen_train23_test2to10, split: train, variant: rare_exception_train_05}
  train_limit: 10000
  eval_limit: 64
  train_sampling_namespace: clutrr.base
  eval_stratify_by: metadata.reasoning_depth
  eval_stratify_all: true
