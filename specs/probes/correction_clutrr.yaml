id: correction.clutrr.one_example
property: online_correction
version: 1
protocol: correction
requires: [learn, generate]
train:
  select: {dataset: clutrr, split: train, variant: full}
control:
  select: {dataset: clutrr, split: test, variant: full}
stress:
  select: {dataset: proofwriter, split: test, variant: full}
pair_by: probe_group_id
metrics:
  primary: normalized_exact_match
  optional: [nll_bits]
difficulty_axes: [reasoning_depth]
options: {train_limit: 10000, eval_limit: 200, corrections: 1}

