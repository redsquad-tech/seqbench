id: correction.clutrr.one_example
property: online_correction
version: 1
protocol: correction
requires: [learn, generate, score]
train:
  select: {dataset: clutrr, config: gen_train23_test2to10, split: train, variant: full}
control:
  select: {dataset: clutrr, config: gen_train23_test2to10, split: test, variant: full}
stress:
  select: {dataset: clutrr, config: gen_train23_test2to10, split: test, variant: full}
pair_by: probe_group_id
metrics:
  primary: capped_nll_bits
  optional: [normalized_exact_match, target_probability_zero]
difficulty_axes: [reasoning_depth]
options:
  train_limit: 10000
  eval_limit: 1000
  minimum_related: 5
  related_limit: 100
