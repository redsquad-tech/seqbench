id: binding.clutrr.counterfactual
property: role_binding
version: 1
protocol: fixed
requires: [generate]
train:
  select: {dataset: clutrr, split: train, variant: nonce}
control:
  select: {dataset: clutrr, split: test, variant: nonce}
stress:
  select: {dataset: clutrr, split: test, variant: counterfactual}
pair_by: probe_group_id
metrics:
  primary: normalized_exact_match
  optional: [candidate_accuracy, nll_bits]
difficulty_axes: [reasoning_depth]
options: {train_limit: 10000, eval_limit: 2000}

