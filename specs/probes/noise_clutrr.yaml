id: noise.clutrr.train_20
property: noise_robustness
version: 1
protocol: training_contrast
requires: [learn, generate]
train:
  select: {dataset: clutrr, config: gen_train23_test2to10, split: train, variant: full}
control:
  select: {dataset: clutrr, config: gen_train23_test2to10, split: test, variant: full}
stress:
  select: {dataset: clutrr, config: gen_train23_test2to10, split: test, variant: full}
pair_by: probe_group_id
metrics:
  primary: normalized_exact_match
  optional: [candidate_accuracy, nll_bits]
difficulty_axes: [reasoning_depth]
options:
  stress_train: {dataset: clutrr, config: gen_train23_test2to10, split: train, variant: noise_20}
  train_limit: 10000
  eval_limit: 2000
