[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "seqbench"
version = "0.1.0"
description = "Executable black-box behavioral benchmark for learning algorithms"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jinja2>=3.1",
  "jsonschema>=4.22",
  "numpy>=1.26",
  "psutil>=6",
  "pyarrow>=16",
  "pyyaml>=6",
]

[project.optional-dependencies]
data = ["huggingface-hub>=0.25", "pyarrow>=16"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
seqbench = "seqbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

